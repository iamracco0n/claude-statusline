<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220" font-family="ui-monospace, 'DejaVu Sans Mono', 'Cascadia Code', Menlo, Consolas, monospace">
  <!-- window -->
  <rect x="0.5" y="0.5" width="679" height="219" rx="12" fill="#0d1117" stroke="#30363d"/>
  <!-- title bar -->
  <rect x="1" y="1" width="678" height="40" rx="12" fill="#161b22"/>
  <rect x="1" y="28" width="678" height="13" fill="#161b22"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="21" r="6" fill="#27c93f"/>
  <text x="340" y="26" text-anchor="middle" font-size="13" fill="#8b949e">Claude Code — 상태줄</text>
  <line x1="1" y1="41" x2="679" y2="41" stroke="#30363d"/>

  <!-- input box (mimic Claude Code prompt) -->
  <rect x="20" y="66" width="640" height="40" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="36" y="91" font-size="15" fill="#484f58">&gt; 사용량 상태줄 예시…</text>

