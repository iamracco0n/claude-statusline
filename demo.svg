  <text x="24" y="146" font-size="16" xml:space="preserve">
    <tspan fill="#e6edf3" font-weight="bold">Opus 4.8</tspan><tspan fill="#6e7681"> · </tspan><tspan fill="#6e7681">5h </tspan><tspan fill="#d29922" font-weight="bold">78%</tspan><tspan fill="#6e7681">(⟳1h12m)  </tspan><tspan fill="#6e7681">7d </tspan><tspan fill="#3fb950" font-weight="bold">34%</tspan><tspan fill="#6e7681">(⟳98h30m)</tspan><tspan fill="#6e7681"> · </tspan><tspan fill="#6e7681">ctx </tspan><tspan fill="#f85149" font-weight="bold">91%</tspan>
  </text>

  <!-- legend -->
  <text x="24" y="190" font-size="13" fill="#6e7681" xml:space="preserve">색상:  <tspan fill="#3fb950">초록 &lt;70%</tspan>   <tspan fill="#d29922">노랑 ≥70%</tspan>   <tspan fill="#f85149">빨강 ≥90%</tspan>      <tspan fill="#6e7681">(⟳ = 리밋 리셋까지 남은 시간)</tspan></text>
